<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Native Places globe icon">
  <defs>
    <radialGradient id="ocean" cx="42%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#5f7d2f"/>
      <stop offset="58%" stop-color="#2f4f1f"/>
      <stop offset="100%" stop-color="#173414"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3a6"/>
      <stop offset="28%" stop-color="#e7bf3a"/>
      <stop offset="58%" stop-color="#b8860b"/>
      <stop offset="82%" stop-color="#f5d766"/>
      <stop offset="100%" stop-color="#8f6500"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff7b8"/>
      <stop offset="50%" stop-color="#dfb52f"/>
      <stop offset="100%" stop-color="#9b6d00"/>
    </linearGradient>
    <clipPath id="globeClip">
      <circle cx="60" cy="60" r="45"/>
    </clipPath>
  </defs>

  <!-- outer medallion -->
  <circle cx="60" cy="60" r="56" fill="url(#gold)" stroke="#6f4f00" stroke-width="1.5"/>
  <circle cx="60" cy="60" r="51" fill="#1f3c16" stroke="#f3d96f" stroke-width="2.4"/>
  <circle cx="60" cy="60" r="47" fill="url(#ocean)" stroke="#b8860b" stroke-width="1.4"/>

  <g clip-path="url(#globeClip)" fill="none" stroke="url(#goldLight)" stroke-width="2" stroke-linecap="round">
    <!-- latitude lines -->
    <path d="M18 44 C33 36 87 36 102 44"/>
    <path d="M15 60 C34 53 86 53 105 60"/>
    <path d="M18 76 C34 84 86 84 102 76"/>
    <!-- longitude lines -->
    <path d="M60 15 C43 28 41 91 60 105"/>
    <path d="M60 15 C77 28 79 91 60 105"/>
    <path d="M38 20 C22 40 22 81 40 101"/>
    <path d="M82 20 C98 40 98 81 80 101"/>
  </g>

  <!-- stylized Americas -->
  <path d="M36 24
           C41 20 47 19 52 22
           L55 27 61 28 64 33
           61 36 56 36 54 40
           49 42 48 47 44 49
           40 49 39 53 41 57
           46 60 45 65 41 68
           38 70 35 68 33 65
           30 63 27 60 25 56
           22 51 24 47 28 44
           31 41 30 37 28 34
           29 29 32 26 36 24 Z"
        fill="url(#goldLight)" stroke="#7c5700" stroke-width="0.8"/>

  <path d="M49 65
           C54 62 60 63 66 66
           72 69 78 71 82 76
           84 80 80 85 76 88
           72 91 69 94 66 100
           63 104 58 106 55 101
           53 97 53 91 50 87
           46 82 43 77 44 72
           45 69 46 67 49 65 Z"
        fill="url(#goldLight)" stroke="#7c5700" stroke-width="0.8"/>

  <!-- small highlights -->
  <path d="M64 31 C67 29 71 29 74 31 C72 34 68 35 64 34 Z" fill="#f7dc6a"/>
  <path d="M52 53 C55 51 58 52 60 55 C57 57 54 57 52 53 Z" fill="#f7dc6a"/>

  <!-- inner shine -->
  <path d="M23 39 A44 44 0 0 1 88 22" fill="none" stroke="#fff3a6" stroke-width="1.4" opacity="0.65"/>
</svg>
